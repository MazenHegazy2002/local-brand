name: CI/CD — LocalBrand Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Jest tests
        run: npm test -- --passWithNoTests

      - name: TypeScript type check
        run: npx tsc --noEmit

  build-and-push:
    name: Build & Push Docker Image (GHCR)
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name for GHCR tag
        id: repo
        run: echo "REPO_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.REPO_NAME }}:latest
            ghcr.io/${{ steps.repo.outputs.REPO_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Fast Deploy to Contabo VPS
    needs: [lint-and-test, build-and-push]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    steps:
      - name: Fast Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 120s
          command_timeout: 30m
          script_stop: false
          script: |
            set +e
            if [ -d "/opt/localbrand" ]; then cd /opt/localbrand; elif [ -d "/var/www/localbrand" ]; then cd /var/www/localbrand; elif [ -d "/app" ]; then cd /app; fi

            git fetch origin master > /dev/null 2>&1 || true
            git reset --hard origin/master > /dev/null 2>&1 || true

            # Detect Docker Compose binary/plugin
            COMPOSE="docker compose"
            if ! docker compose version > /dev/null 2>&1; then
              COMPOSE="docker-compose"
            fi

            # A failed pull used to be ignored, silently restarting the OLD image while
            # the job reported success. Retry, then fail the deploy if it never lands.
            PULLED=0
            for i in 1 2 3 4 5; do
              if $COMPOSE pull app; then PULLED=1; break; fi
              echo "Image pull failed (attempt $i), retrying in 15s..."
              sleep 15
            done
            if [ "$PULLED" != 1 ]; then
              echo "::error::Could not pull the new app image; the running version was NOT updated."
              exit 1
            fi
            $COMPOSE down --remove-orphans || docker-compose down --remove-orphans || true
            $COMPOSE up -d --force-recreate --remove-orphans || docker-compose up -d --force-recreate --remove-orphans || true
            $COMPOSE exec -T app npx prisma migrate deploy || docker-compose exec -T app npx prisma migrate deploy || true
            # Configure ngrok auth token permanently on VPS
            if [ -n "${{ secrets.NGROK_AUTHTOKEN }}" ]; then
              mkdir -p /root/.config/ngrok
              printf 'version: "3"\nagent:\n  authtoken: %s\n' "${{ secrets.NGROK_AUTHTOKEN }}" > /root/.config/ngrok/ngrok.yml
              chmod 600 /root/.config/ngrok/ngrok.yml
              if command -v ngrok >/dev/null 2>&1; then
                ngrok config add-authtoken "${{ secrets.NGROK_AUTHTOKEN }}" >/dev/null 2>&1 || true
              fi
            fi
            docker image prune -f || true
            echo "⚡ Deployed pre-built container successfully to Contabo VPS"

