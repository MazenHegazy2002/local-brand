name: Daily Backup to Google Drive

on:
  schedule:
    # Runs daily at 03:00 UTC (05:00 AM Cairo time)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      gdrive_b64:
        description: 'Base64 encoded service account JSON to sync to VPS'
        required: false
        default: ''

jobs:
  backup-to-gdrive:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Daily Backup on VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            cd /opt/localbrand
            git fetch origin master
            git reset --hard origin/master
            if [ -n "${{ inputs.gdrive_b64 }}" ]; then
              echo "${{ inputs.gdrive_b64 }}" | base64 -d > google-service-account.json
              chmod 600 google-service-account.json
              echo "✅ Synced google-service-account.json to VPS"
            fi
            chmod +x scripts/vps-backup-to-gdrive.sh
            ./scripts/vps-backup-to-gdrive.sh
