name: Daily Backup to Google Drive

on:
  schedule:
    # Runs daily at 03:00 UTC (05:00 AM Cairo time)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      rclone_conf_b64:
        description: 'Base64 encoded rclone.conf to sync to VPS'
        required: false
        default: ''

jobs:
  backup-to-gdrive:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Daily Backup on VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            cd /opt/localbrand
            git fetch origin master
            git reset --hard origin/master

            # Ensure rclone is installed on VPS
            if ! command -v rclone >/dev/null 2>&1; then
              echo "📥 Installing rclone on VPS..."
              curl -fsSL https://rclone.org/install.sh | bash
            fi

            # Sync rclone.conf if provided
            if [ -n "${{ inputs.rclone_conf_b64 }}" ]; then
              mkdir -p /root/.config/rclone
              echo "${{ inputs.rclone_conf_b64 }}" | base64 -d > /root/.config/rclone/rclone.conf
              chmod 600 /root/.config/rclone/rclone.conf
              echo "✅ Synced rclone.conf to VPS"
            fi

            chmod +x scripts/vps-backup-to-gdrive.sh
            ./scripts/vps-backup-to-gdrive.sh
