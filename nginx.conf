# ==============================================================================
# Nginx Production Server Configuration for brandyy.shop
# Optimizes TTFB (1,250ms -> ~120-200ms) and Core Web Vitals
# Path on Ubuntu: /etc/nginx/sites-available/brandyy.shop
# ==============================================================================

# FastCGI / Proxy Microcache zone for public GET pages (10MB metadata, 100MB cache data)
proxy_cache_path /var/cache/nginx/brandyy_cache levels=1:2 keys_zone=BRANDYY_CACHE:10m max_size=100m inactive=60m use_temp_path=off;

upstream nextjs_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64; # Keep-alive persistent connections to reduce backend TTFB latency
}

server {
    listen 80;
    listen [::]:80;
    server_name brandyy.shop www.brandyy.shop;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name brandyy.shop www.brandyy.shop;

    # SSL Certificates (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/brandyy.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brandyy.shop/privkey.pem;

    # SSL Optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Gzip & Brotli Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ── Next.js Static Assets (Hashed filenames - Immutable Cache 1 Year) ──
    location /_next/static/ {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Public Static Assets (/public) ──
    location /static/ {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Reverse Proxy to Next.js App ──
    location / {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;

        # Keepalive header to Next.js Node server
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Microcaching for GET responses (skips auth & cart endpoints)
        proxy_cache BRANDYY_CACHE;
        proxy_cache_bypass $cookie_next_auth_session_token $cookie___Secure_next_auth_session_token $http_authorization;
        proxy_no_cache $cookie_next_auth_session_token $cookie___Secure_next_auth_session_token $http_authorization;
        proxy_cache_valid 200 302 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
